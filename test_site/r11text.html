<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>非图标、非词汇表的推进控件</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px}
.grp{list-style:none;color:#888}#next{cursor:pointer;color:#06c;text-decoration:underline}</style>
</head>
<body>
<!-- 第十一轮评审 A（实测 S）：`advUnknown` 的旧判据要求候选「像图标」（带 svg 或类名含
     btn/icon/arrow/next/prev/page）。于是「可见、可点、但既不图标、也不在 findAdvance 词汇表里」
     的控件（这里是「继续看下一批」+ class `go`）落回 `absent` →
     `one_page_total_pager:"absent"` → 「一页装得下」的声明被信任 → exhausted/resume=false，
     而点一下它就是第 2 页。
     修法：候选不再要求图标（列表之后只要**有可见候选**就置 unknown），
     第三态也从 `absent` 改名 `unverified`（它只能证明「我没看见」，不是「证明了没有」）。 -->
<main id="main">
  <ul id="results"></ul>
  <nav class="pager">
    <a id="prev" href="?p=1">上一页</a>
    <span id="next" class="go" role="button">继续看下一批</span>
  </nav>
</main>
<script>
const q = new URLSearchParams(location.search);
let p = Math.max(1, parseInt(q.get('p') || '1', 10));
const PAGES = parseInt(q.get('pages') || '3', 10);
const PER = 5;
const results = document.getElementById('results');
const next = document.getElementById('next');
const widget = '<li class="grp"><span aria-setsize="' + PER + '" aria-posinset="' + PER + '">本组 1-' + PER + ' of ' + PER + '</span></li>';
const rows = (from) => {
  let h = '';
  for (let i = from; i < from + PER; i++) {
    h += '<li class="card"><a class="title" href="?item=' + i + '">第 ' + i + ' 条记录</a>'
       + '<span class="meta">标签' + i + '</span></li>';
  }
  return h;
};
const render = () => {
  results.innerHTML = widget + rows((p - 1) * PER);
  next.style.display = (p < PAGES) ? '' : 'none';
};
next.addEventListener('click', () => { if (p < PAGES) { p += 1; render(); } });
render();
</script>
</body>
</html>
